<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusThesis — каталог тем</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Шапка -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand brand" href="#">
      <i class="bi bi-mortarboard-fill"></i> CampusThesis
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item" id="notificationsNav" style="display:none;">
          <a class="nav-link" href="#" onclick="showNotifications(); return false;">
            <i class="bi bi-bell-fill"></i> Уведомления
            <span id="notificationsBadge" class="notification-badge" style="display:none;">0</span>
          </a>
        </li>
        <li class="nav-item" id="userInfo" style="display:none;">
          <span class="nav-link">
            <i class="bi bi-person-fill"></i> <span id="userName"></span>
          </span>
        </li>
        <li class="nav-item" id="authButtons">
          <button class="btn btn-outline-primary" onclick="openLoginModal()">
            <i class="bi bi-box-arrow-in-right"></i> Вход
          </button>
        </li>
        <li class="nav-item" id="logoutBtn" style="display:none;">
          <button class="btn btn-danger" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i> Выход
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Основной контент -->
<main class="container my-4">
  <h4 class="mb-3">Каталог тем ВКР</h4>
  <div class="row g-2 mb-3">
    <div class="col-12 col-md-4">
      <input id="search" class="form-control" placeholder="Поиск по названию или описанию">
    </div>
    <div class="col-6 col-md-2">
      <select id="program" class="form-select">
        <option value="">Все направления</option>
        <option value="1">09.03.04 Программная инженерия</option>
        <option value="2">09.03.03 Прикладная информатика</option>
        <option value="3">10.03.01 Информационная безопасность</option>
      </select>
    </div>
    <div class="col-6 col-md-2">
      <select id="status" class="form-select">
        <option value="">Любой статус</option>
        <option value="open">Свободна</option>
        <option value="taken">Занята</option>
      </select>
    </div>
    <div class="col-12 col-md-2">
      <button id="applyFilters" class="btn btn-outline-primary w-100">Найти</button>
    </div>
  </div>
  <div id="topics" class="row g-3"></div>
</main>

<!-- Модальное окно входа -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="loginModalLabel">Вход в систему</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="loginPassword" placeholder="Введите пароль" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
        <details class="mt-3">
          <summary class="text-muted small">Тестовые аккаунты</summary>
          <small class="text-muted">
            Студент 1: student1@campus.ru / 123456<br>
            Студент 2: student2@campus.ru / 654321<br>
            Руководитель 1: administrator1@campus.ru / 123456<br>
            Руководитель 2: administrator2@campus.ru / 654321
          </small>
        </details>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
